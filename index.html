<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b14" />
    <title>TypeLex · 拟真键盘打字与词汇记忆</title>
    <meta
      name="description"
      content="TypeLex 是一个 3D 拟真键盘的打字练习平台：用高中、四级、六级全量词表与日语 N1–N5 词汇做打字训练，边打字边背单词。"
    />
    <script>
      // Apply the persisted theme before first paint so there is no flash.
      try {
        var stored = localStorage.getItem('typelex.theme');
        var theme = stored === 'light' || stored === 'dark' ? stored : null;
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <!--
      Fonts are self-hosted (bundled from npm via @fontsource-variable) rather than
      loaded from a CDN: no third-party request on first paint, no render-blocking
      stylesheet, and the type never silently degrades to a fallback face.
      CJK deliberately stays on the system stack — PingFang SC / Microsoft YaHei /
      Noto Sans CJK are excellent and a bundled Chinese webfont would cost megabytes.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
